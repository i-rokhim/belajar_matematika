<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-labelledby="judul">
  <title id="judul">Bilangan 247: angka 2 di ratusan, angka 4 di puluhan, angka 7 di satuan</title>
  <rect x="0" y="0" width="360" height="200" fill="#fffbe6"/>
  <rect x="15" y="20" width="100" height="40" rx="8" fill="#dbe9fb" stroke="#1b5e9e" stroke-width="3"/>
  <rect x="130" y="20" width="100" height="40" rx="8" fill="#dbe9fb" stroke="#1b5e9e" stroke-width="3"/>
  <rect x="245" y="20" width="100" height="40" rx="8" fill="#dbe9fb" stroke="#1b5e9e" stroke-width="3"/>
  <text x="65" y="47" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1b5e9e">Ratusan</text>
  <text x="180" y="47" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1b5e9e">Puluhan</text>
  <text x="295" y="47" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1b5e9e">Satuan</text>
  <rect x="15" y="80" width="100" height="100" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/>
  <rect x="130" y="80" width="100" height="100" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/>
  <rect x="245" y="80" width="100" height="100" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/>
  <text x="65" y="153" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="#2e7d32">2</text>
  <text x="180" y="153" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="#2e7d32">4</text>
  <text x="295" y="153" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="#2e7d32">7</text>
</svg>