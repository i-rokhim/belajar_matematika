  <h1>Pengurangan</h1>
  <p>Ada 5 ekor kambing di atas truk. Dua ekor melompat turun. Berapa ekor kambing yang masih di truk?</p>

  <img src="gambar/pengurangan.svg" alt="Truk membawa 3 kambing, dan 2 kambing lain sudah melompat turun ke tanah">

  <p>Kita hitung: 5 - 2 = 3. Jadi masih ada 3 ekor kambing di truk.</p>

  <h2>Coba lihat tabelnya</h2>
  <table>
    <tr>
      <th>Soal</th>
      <th>Jawaban</th>
    </tr>
    <tr>
      <td>2 - 1</td>
      <td>1</td>
    </tr>
    <tr>
      <td>3 - 2</td>
      <td>1</td>
    </tr>
    <tr>
      <td>5 - 2</td>
      <td>3</td>
    </tr>
  </table>
</body>
